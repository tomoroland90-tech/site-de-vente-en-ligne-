<!DOCTYPE html>
<html lang="fr">

<style>
:root{--bg:#F0F2F5;--card:#fff;--line:#E4E6EB;--text:#050505;--muted:#65676B;--blue:#0866FF;--green:#25D366;--red:#E53E3E}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
.header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.header-inner{height:60px;display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;padding:0 16px}
.logo{font-weight:800;font-size:26px;letter-spacing:-.05em}
.container{max-width:680px;margin:0 auto;padding:0 12px}
.btn{padding:10px 16px;border-radius:20px;font-weight:600;font-size:14px;border:0;cursor:pointer}
.btn-dark{background:#111;color:#fff}.btn-light{background:#E4E6EB}
.btn-commander{background:var(--green);color:#fff;width:100%;padding:13px;border-radius:10px;font-weight:700;font-size:15px;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer}
.btn-commander:hover{background:#1DA851}
.error-box{background:#FFF5F5;border:1px solid #FED7D7;color:#C53030;padding:12px;border-radius:8px;font-size:13px;margin:10px 0;display:none}
.error-box.show{display:block}
.add-post-card{background:var(--card);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.1);padding:12px;display:flex;gap:10px;align-items:center;margin:16px 0;cursor:pointer;border:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:50%;background:#ddd;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.add-input{flex:1;background:#F0F2F5;padding:10px 14px;border-radius:20px;color:var(--muted);font-size:15px}
.post-card{background:var(--card);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.1);margin-bottom:16px;overflow:hidden;border:1px solid var(--line)}
.post-header{padding:12px 16px 8px;display:flex;gap:10px;align-items:flex-start}
.post-shop{font-weight:600;font-size:15px;cursor:pointer}
.post-meta{font-size:12px;color:var(--muted);line-height:1.4}
.post-content{padding:0 16px 12px}
.post-title{font-weight:800;font-size:17px;line-height:1.3;margin-bottom:6px}
.post-desc{font-size:14.5px;line-height:1.45;color:#222;white-space:pre-wrap}
.post-images{display:grid;gap:2px;background:#000}
.post-images img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.price-tag{font-weight:800;color:#111;font-size:16px;margin-top:6px}
.badge-new{background:#E7F3FF;color:#0866FF;padding:2px 6px;border-radius:10px;font-size:10px;font-weight:700;margin-left:6px}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);z-index:100;display:none;place-items:center;padding:16px}
.modal-bg.open{display:grid}
.modal{background:#fff;border-radius:12px;max-width:520px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.2);overflow:hidden;max-height:90vh;overflow-y:auto}
.modal-head{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:700}
.modal-body{padding:16px}
.field{margin:10px 0;display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;font-weight:700;text-transform:uppercase;color:#555}
.field input,.field textarea,.field select{padding:12px;border-radius:8px;border:1px solid #CCD0D5;font-size:15px;outline:0;width:100%}
.prefix{padding:12px;background:#F0F2F5;border:1px solid #CCD0D5;border-radius:8px;font-weight:700}
.image-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.image-preview img{width:80px;height:80px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.boutique-page{position:fixed;inset:0;background:var(--bg);z-index:80;overflow:auto;display:none}
.boutique-page.open{display:block}
.cover{height:200px;background:linear-gradient(135deg,#111,#555)}
.boutique-info-card{background:#fff;margin:-50px auto 0;max-width:680px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:16px;position:relative}
</style>

<script>
// ========== CONFIG SUPABASE ==========//
const supabase = window.supabase.createClient(

    "https://cvcgtiykdocjhwanyned.supabase.co",

    "sb_publishable_Q-_I_gqrhW-pCXDYtlofEg_g0gOM9Xd"

);

let role='client', mode='register', allProducts=[], sortOrder='recent';

function getUser(){
  try{
    const u = localStorage.getItem('shoponline_user');
    return u && u!== "undefined"? JSON.parse(u) : null;
  }catch{
    localStorage.removeItem('shoponline_user');
    return null
  }
}
function setUser(u){localStorage.setItem('shoponline_user',JSON.stringify(u))}
function showError(id, msg){const el=document.getElementById(id); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),6000);}

function formatDateTime(dateStr){
  if(!dateStr) return {duree:'', full:''};
  const d = new Date(dateStr); const now = new Date();
  const diffMs = now - d; const diffMin = Math.floor(diffMs/60000); const diffHour = Math.floor(diffMin/60); const diffDay = Math.floor(diffHour/24);
  let duree='';
  if(diffMin<1) duree="À l'instant"; else if(diffMin<60) duree=`Il y a ${diffMin} min`; else if(diffHour<24) duree=`Il y a ${diffHour}h`; else if(diffDay===1) duree="Hier"; else if(diffDay<7) duree=`Il y a ${diffDay} jours`; else duree=`Il y a ${Math.floor(diffDay/7)} sem.`;
  const date = d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}); const heure = d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  return {duree, date, heure, full:`Publié le ${date} à ${heure}`};
}
function sortBy(order){ sortOrder=order; renderFeed(); }

async function fetchProducts(){

    const { data, error } = await supabase

        .from("products")

        .select(`
            *,
            boutiques(
                name,
                city,
                whatsapp
            )
        `)

        .order("created_at",{ascending:false});

    if(error){

        console.log(error);

        return [];

    }

    return data;

}

  if(!user){ showError('authError','⛔ Tu dois te connecter en tant que client pour commander.'); openAuth('login'); return; }
  if(user.role!=='client'){ alert('⛔ Seul un compte client peut commander.'); return; }
  const nomClient = `${user.prenom||''} ${user.nom||''}`.trim() || user.phone;
  const villeClient = user.ville || 'Non renseignée';
  const phoneClient = user.phone;
  const message = `Salut c'est ${nomClient} j'utilise SHOP ONLINE et je voudrais commander le produit : ${productName} de la boutique ${boutiqueName} je réside a ${villeClient} mon numéro est le ${phoneClient}`;
  function commanderProduit(productName, boutiqueName, price, whatsapp) {

    const user = getUser();

    if (!user) {
        openAuth("login");
        alert("Vous devez vous connecter pour commander.");
        return;
    }

    if (user.role !== "client") {
        alert("Seuls les clients peuvent commander.");
        return;
    }

    const nomClient =
        `${user.prenom || ""} ${user.nom || ""}`.trim();

    const message =
`Bonjour,

Je souhaite commander le produit :

📦 ${productName}

🏪 Boutique : ${boutiqueName}

💰 Prix : ${Number(price).toLocaleString()} FCFA

👤 Client : ${nomClient}

📞 Téléphone : ${user.phone}

Merci.`;

    // Ajouter automatiquement le code pays si nécessaire
    let numero = whatsapp;

    if (!numero.startsWith("237")) {
        numero = "237" + numero;
    }

    window.open(
        `https://wa.me/${numero}?text=${encodeURIComponent(message)}`,
        "_blank"
    );
}

async function renderAll(){
  const user=getUser();
  document.getElementById('addPostFrame').style.display = user?.role==='vendeur'? 'flex' : 'none';
  document.getElementById('logoutBtn').style.display = user? 'inline-block' : 'none';
  const headerBtns = document.querySelectorAll('.header-inner');
  if(headerBtns[0]) headerBtns[0].style.display = user? 'none' : 'inline-block';
  if(headerBtns[1]) headerBtns[1].style.display = user? 'none' : 'inline-block';
  document.getElementById('userBadge').style.display = user? 'inline-block' : 'none';
  if(user) document.getElementById('userBadge').textContent = `${user.phone} • ${user.role}`;

  if(user && user.role==='vendeur'){
    
    async function renderAll() {

    const user = getUser();

    document.getElementById("addPostFrame").style.display =
        user && user.role === "vendeur" ? "flex" : "none";

    document.getElementById("logoutBtn").style.display =
        user ? "inline-block" : "none";

    document.getElementById("userBadge").style.display =
        user ? "inline-block" : "none";

    if (user) {
        document.getElementById("userBadge").textContent =
            `${user.phone} • ${user.role}`;
    }

    // ======== COMPTE VENDEUR ========

    // Création automatique de la boutique
if (role === "vendeur") {

    const { error } = await supabase
        .from("boutiques")
        .insert([
            {
                user_id: user.id,
                name: form.boutiqueName,
                slug: form.boutiqueName
                    .toLowerCase()
                    .replace(/\s+/g, "-") + "-" + Date.now(),

                activite: form.activite,
                city: form.city,
                quartier: "",

                phone: form.phone,
                whatsapp: form.whatsapp,

                email: form.email,

                description: "",

                verified: false,
                featured: false
            }
        ]);

    if (error) {
        alert(error.message);
        return;
    }
}

    // ======== COMPTE CLIENT ========

    else if (user) {

        document.getElementById("accountInfo").innerHTML = `
            <b>${user.prenom || ""} ${user.nom || ""}</b>
            <div style="font-size:12px">
                ${user.ville || ""}
                • ${user.phone}
                • ${user.role}
            </div>
        `;

        document.getElementById("accountInfo").style.display = "block";

    }

    else {

        document.getElementById("accountInfo").style.display = "none";

    }

    allProducts = await fetchProducts();

    renderFeed();
}

  allProducts = await fetchProducts();
  renderFeed();
}

function renderFeed(){
  const el=document.getElementById('feed');
  let products = [...allProducts];
  if(sortOrder==='oldest') products.reverse();
  if(!products.length){
    el.innerHTML=`<div class="empty"><h2 style="font-size:22px;font-weight:800">SHOP ONLINE</h2><p>Aucune publication pour le moment.</p></div>`;
    return;
  }
  el.innerHTML=products.map(p=>{
    const time = formatDateTime(p.created_at);
    const isNew = (new Date() - new Date(p.created_at)) < 3600000;
    return `<div class="post-card">
      <div class="post-header"><div class="avatar"><img src="https://ui-avatars.com/api/?name=${encodeURIComponent(p.boutiques?.name||'Shop')}&background=111&color=fff"/></div><div style="flex:1"><div class="post-shop">${p.boutiques?.name||''} ${isNew?'<span class="badge-new">NOUVEAU</span>':''}</div><div class="post-meta">📍 ${p.boutiques?.city||''} • ⏰ ${time.duree}<br>📅 ${time.full}</div></div></div>
      <div class="post-content"><div class="post-title">${p.name}</div>${p.description?`<div class="post-desc">${p.description}</div>`:''}<div class="price-tag">${Number(p.price).toLocaleString()} FCFA</div></div>
      <div style="padding:12px 16px 16px"><button class="btn-commander" onclick="commanderProduit('${p.name}', '${p.boutiques?.name||''}', ${p.price}, '${p.boutiques?.whatsapp||''}')">🛒 Commander</button></div>
    </div>`;
  }).join('');
}

function openPublish(){const u=getUser(); if(!u||u.role!=='vendeur') return; document.getElementById('publishModal').classList.add('open')}
function closePublish(){document.getElementById('publishModal').classList.remove('open')}
async function publishProduct() {

    const user = getUser();

    const name = document.getElementById("pName").value.trim();
    const desc = document.getElementById("pDesc").value.trim();
    const price = document.getElementById("pPrice").value.trim();
    const category = document.getElementById("pCat").value;

    if (!name || !price) {
        alert("Nom et prix obligatoires.");
        return;
    }

    // Recherche de la boutique du vendeur
    const { data: boutiques, error: boutiqueError } = await supabase
        .from("boutiques")
        .select("*")
        .eq("user_id", user.id);

    if (boutiqueError) {
        alert(boutiqueError.message);
        return;
    }

    if (!boutiques.length) {
        alert("Vous devez d'abord créer une boutique.");
        return;
    }

    // ===== Upload de l'image =====

    const file = document.getElementById("pImage").files[0];

    let imageUrl = "";

    if (file) {

        const fileName = Date.now() + "-" + file.name;

        const { error: uploadError } = await supabase.storage
            .from("products")
            .upload(fileName, file);

        if (uploadError) {
            alert(uploadError.message);
            return;
        }

        const { data } = supabase.storage
            .from("products")
            .getPublicUrl(fileName);

        imageUrl = data.publicUrl;
    }

    // ===== Enregistrement du produit =====

    const { error } = await supabase
        .from("products")
        .insert([
            {
                boutique_id: boutiques[0].id,
                name: name,
                description: desc,
                price: parseInt(price),
                category: category,
                images: imageUrl ? [imageUrl] : []
            }
        ]);

    if (error) {
        alert(error.message);
        return;
    }

    alert("Produit publié avec succès !");

    document.getElementById("pName").value = "";
    document.getElementById("pDesc").value = "";
    document.getElementById("pPrice").value = "";
    document.getElementById("pImage").value = "";

    closePublish();

    renderAll();
}
function openAuth(m='register'){mode=m;document.getElementById('authModal').classList.add('open');upd(); document.getElementById('authError').classList.remove('show');}
function closeAuth(){document.getElementById('authModal').classList.remove('open')}

async function register(e) {
    e.preventDefault();

    const fd = new FormData(e.target);
    const form = Object.fromEntries(fd.entries());

    form.role = role;

    const { data, error } = await supabase
        .from("users")
        .insert([form])
        .select();

    if (error) {
        showError("authError", error.message);
        return;
    }

    const user = data[0];

    setUser(user);

    closeAuth();

    renderAll();

    alert("Compte créé avec succès !");
}

async function doLogin() {

    const phone = document.getElementById("loginPhone").value.trim();
    const password = document.getElementById("loginPassword").value;

    const { data, error } = await supabase
        .from("users")
        .select("*")
        .eq("phone", phone)
        .single();

    if (error || !data) {
        showError("authError", "⛔ Téléphone introuvable.");
        return;
    }

    if (data.password !== password) {
        showError("authError", "⛔ Mot de passe incorrect.");
        return;
    }

    setUser(data);

    closeAuth();

    renderAll();

    alert("Connexion réussie !");
}

async function openProfile(){

const user=getUser();

if(!user) return;

const {data,error}=await supabase

.from("boutiques")

.select("*")

.eq("user_id",user.id)

.single();

if(error){

alert(error.message);

return;

}

shopName.value=data.name;

shopDescription.value=data.description||"";

shopCity.value=data.city||"";

shopQuartier.value=data.quartier||"";

shopPhone.value=data.phone||"";

shopWhatsapp.value=data.whatsapp||"";

shopEmail.value=data.email||"";

shopFacebook.value=data.facebook||"";

shopInstagram.value=data.instagram||"";

shopTiktok.value=data.tiktok||"";

profileModal.classList.add("open");

}

function closeProfile(){

profileModal.classList.remove("open");

}
async function saveProfile(){

const user=getUser();

const {error}=await supabase

.from("boutiques")

.update({

name:shopName.value,

description:shopDescription.value,

city:shopCity.value,

quartier:shopQuartier.value,

phone:shopPhone.value,

whatsapp:shopWhatsapp.value,

email:shopEmail.value,

instagram:shopInstagram.value,

})

.eq("user_id",user.id);

alert(error.message);

}

alert("Profil enregistré.");

}
