<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHOP ONLINE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0F2F5;--card:#fff;--line:#E4E6EB;--text:#050505;--muted:#65676B;--blue:#0866FF;--green:#25D366;--red:#E53E3E}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
.header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.header-inner{height:60px;display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;padding:0 16px}
.logo{font-weight:800;font-size:26px;letter-spacing:-.05em}
.container{max-width:680px;margin:0 auto;padding:0 12px}
.btn{padding:10px 16px;border-radius:20px;font-weight:600;font-size:14px;border:0;cursor:pointer}
.btn-dark{background:#111;color:#fff}.btn-light{background:#E4E6EB}
.btn-commander{background:var(--green);color:#fff;width:100%;padding:13px;border-radius:10px;font-weight:700;font-size:15px;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer}
.btn-commander:hover{background:#1DA851}
.error-box{background:#FFF5F5;border:1px solid #FED7D7;color:#C53030;padding:12px;border-radius:8px;font-size:13px;margin:10px 0;display:none}
.error-box.show{display:block}
.add-post-card{background:var(--card);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.1);padding:12px;display:flex;gap:10px;align-items:center;margin:16px 0;cursor:pointer;border:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:50%;background:#ddd;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.add-input{flex:1;background:#F0F2F5;padding:10px 14px;border-radius:20px;color:var(--muted);font-size:15px}
.post-card{background:var(--card);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.1);margin-bottom:16px;overflow:hidden;border:1px solid var(--line)}
.post-header{padding:12px 16px 8px;display:flex;gap:10px;align-items:flex-start}
.post-shop{font-weight:600;font-size:15px;cursor:pointer}
.post-meta{font-size:12px;color:var(--muted);line-height:1.4}
.post-content{padding:0 16px 12px}
.post-title{font-weight:800;font-size:17px;line-height:1.3;margin-bottom:6px}
.post-desc{font-size:14.5px;line-height:1.45;color:#222;white-space:pre-wrap}
.post-images{display:grid;gap:2px;background:#000}
.post-images img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.price-tag{font-weight:800;color:#111;font-size:16px;margin-top:6px}
.badge-new{background:#E7F3FF;color:#0866FF;padding:2px 6px;border-radius:10px;font-size:10px;font-weight:700;margin-left:6px}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);z-index:100;display:none;place-items:center;padding:16px}
.modal-bg.open{display:grid}
.modal{background:#fff;border-radius:12px;max-width:520px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.2);overflow:hidden;max-height:90vh;overflow-y:auto}
.modal-head{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:700}
.modal-body{padding:16px}
.field{margin:10px 0;display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;font-weight:700;text-transform:uppercase;color:#555}
.field input,.field textarea,.field select{padding:12px;border-radius:8px;border:1px solid #CCD0D5;font-size:15px;outline:0;width:100%}
.prefix{padding:12px;background:#F0F2F5;border:1px solid #CCD0D5;border-radius:8px;font-weight:700}
.image-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.image-preview img{width:80px;height:80px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.boutique-page{position:fixed;inset:0;background:var(--bg);z-index:80;overflow:auto;display:none}
.boutique-page.open{display:block}
.cover{height:200px;background:linear-gradient(135deg,#111,#555)}
.boutique-info-card{background:#fff;margin:-50px auto 0;max-width:680px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:16px;position:relative}
</style>
</head>
<body>
<header class="header"><div class="header-inner">
<div class="logo">SHOP ONLINE</div>
<div style="display:flex;gap:8px;align-items:center">
<span id="userBadge" style="display:none;font-size:12px;font-weight:600;background:#E7F3FF;color:#0866FF;padding:6px 10px;border-radius:20px"></span>
<button class="btn btn-light" onclick="openAuth('login')">Connexion</button>
<button class="btn btn-dark" onclick="openAuth('register')">Créer compte</button>
<button id="logoutBtn" class="btn btn-light" style="display:none" onclick="logout()">Déconnexion</button>
</div>
</div></header>

<main class="container">
<div id="addPostFrame" class="add-post-card" style="display:none" onclick="openPublish()"><div class="avatar"><img src="https://ui-avatars.com/api/?name=V&background=111&color=fff"/></div><div class="add-input">Ajouter une publication... Quoi de neuf?</div><div>📸</div></div>
<div id="accountInfo" style="display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:16px 0"></div>
<div style="display:flex;gap:8px;margin:12px 0;overflow:auto">
<button class="btn btn-dark" style="font-size:12px;padding:8px 12px" onclick="sortBy('recent')">🕒 Plus récents</button>
<button class="btn btn-light" style="font-size:12px;padding:8px 12px" onclick="sortBy('oldest')">📅 Plus anciens</button>
</div>
<div id="feed"><div class="empty">Chargement...<br><small>Aucune publication pour le moment</small></div></div>
</main>

<div class="modal-bg" id="publishModal"><div class="modal"><div class="modal-head"><span>Créer publication</span><button onclick="closePublish()" style="width:28px;height:28px;border-radius:50%;border:0;background:#E4E6EB">✕</button></div><div class="modal-body">
<div class="field"><label>Nom produit *</label><input id="pName" placeholder="Ex: Robe Ankara"></div>
<div class="field"><label>Description</label><textarea id="pDesc" placeholder="Matière, taille, livraison..."></textarea></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label>Prix FCFA *</label><input id="pPrice" type="number" placeholder="25000"></div><div class="field"><label>Catégorie</label><select id="pCat"><option>Mode</option><option>Téléphones</option><option>Beauté</option><option>Maison</option><option>Chaussures</option></select></div></div>
<button class="btn btn-dark" style="width:100%;margin-top:10px;background:#0866FF" onclick="publishProduct()">Publier</button>
</div></div></div>

<div class="modal-bg" id="authModal"><div class="modal"><div class="modal-head"><span id="authTitle">Créer compte</span><button onclick="closeAuth()" style="width:28px;height:28px;border-radius:50%;border:0;background:#E4E6EB">✕</button></div><div class="modal-body">
<div id="roleSwitch" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#F0F2F5;padding:5px;border-radius:10px;margin-bottom:12px">
<div id="rc" onclick="setRole('client')" style="padding:10px;border-radius:8px;text-align:center;font-weight:700;cursor:pointer;background:#111;color:#fff">👤 Client</div>
<div id="rv" onclick="setRole('vendeur')" style="padding:10px;border-radius:8px;text-align:center;font-weight:700;cursor:pointer">🏪 Vendeur</div>
</div>
<div id="authError" class="error-box"></div>

<form id="f-client" onsubmit="register(event)"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="field"><label>Nom *</label><input required name="nom"></div><div class="field"><label>Prénom *</label><input required name="prenom"></div></div><div class="field"><label>Ville *</label><select required name="ville"><option value="">Choisir</option><option>Douala</option><option>Yaoundé</option><option>Bafoussam</option></select></div><div class="field"><label>Téléphone *</label><div style="display:flex;gap:6px"><div class="prefix">+237</div><input required name="phone" pattern="[0-9]{9}" maxlength="9" placeholder="6XXXXXXXX"></div></div><div class="field"><label>Mot de passe *</label><input required type="password" name="password"></div><button class="btn btn-dark" style="width:100%;margin-top:8px" type="submit">Créer compte client</button></form>

<form id="f-vendeur" style="display:none" onsubmit="register(event)"><div class="field"><label>Nom boutique *</label><input required name="boutiqueName"></div><div class="field"><label>Téléphone *</label><div style="display:flex;gap:6px"><div class="prefix">+237</div><input required name="phone" pattern="[0-9]{9}" maxlength="9"></div></div><div class="field"><label>Email *</label><input required type="email" name="email"></div><div class="field"><label>WhatsApp *</label><div style="display:flex;gap:6px"><div class="prefix">+237</div><input required name="whatsapp" pattern="[0-9]{9}" maxlength="9"></div></div><div class="field"><label>Ville *</label><select required name="city"><option value="">Choisir</option><option>Douala</option><option>Yaoundé</option></select></div><div class="field"><label>Activité *</label><select required name="activite"><option>Mode</option><option>Téléphones</option><option>Beauté</option><option>Maison</option></select></div><div class="field"><label>Mot de passe *</label><input required type="password" name="password"></div><button class="btn btn-dark" style="width:100%;margin-top:8px" type="submit">Créer compte vendeur</button></form>

<div id="loginBox" style="display:none"><div class="field"><label>Numéro de téléphone *</label><div style="display:flex;gap:6px"><div class="prefix">+237</div><input id="loginPhone" pattern="[0-9]{9}" maxlength="9" placeholder="6XXXXXXXX"></div></div><div class="field"><label>Mot de passe *</label><input id="loginPassword" type="password"></div><button class="btn btn-dark" style="width:100%;margin-top:8px;background:#0866FF" onclick="doLogin()">Se connecter</button></div>

<div style="text-align:center;margin-top:10px"><a href="#" id="switchLink" onclick="toggleMode();return false" style="font-size:13px;font-weight:600;color:#0866FF">Se connecter</a></div>
</div></div></div>

<div class="boutique-page" id="boutiquePage"><div class="cover"></div><div class="boutique-info-card"><button onclick="closeBoutique()" style="border:0;background:#E4E6EB;padding:8px 12px;border-radius:20px;cursor:pointer">← Retour</button><div style="display:flex;gap:14px;margin-top:12px"><div class="avatar" style="width:80px;height:80px;border:4px solid #fff"><img id="bpAvatar" src=""/></div><div><h1 id="bpName" style="font-size:22px;font-weight:800"></h1><div id="bpMeta" style="font-size:13px;color:var(--muted)"></div></div></div></div><div class="container" style="margin-top:16px"><div id="bpFeed"></div></div></div>

<script>
// ========== CONFIG SUPABASE ==========
const SUPABASE_URL = 'https://cvcgtiykdocjhwanyned.supabase.co/rest/v1';
const SUPABASE_KEY = 'sb_publishable_Q-_I_gqrhW-pCXDYtlofEg_g0gOM9Xd';

const headers = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
};

let role='client', mode='register', allProducts=[], sortOrder='recent';

function getUser(){
  try{
    const u = localStorage.getItem('shoponline_user');
    return u && u!== "undefined"? JSON.parse(u) : null;
  }catch{
    localStorage.removeItem('shoponline_user');
    return null
  }
}
function setUser(u){localStorage.setItem('shoponline_user',JSON.stringify(u))}
function showError(id, msg){const el=document.getElementById(id); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),6000);}

function formatDateTime(dateStr){
  if(!dateStr) return {duree:'', full:''};
  const d = new Date(dateStr); const now = new Date();
  const diffMs = now - d; const diffMin = Math.floor(diffMs/60000); const diffHour = Math.floor(diffMin/60); const diffDay = Math.floor(diffHour/24);
  let duree='';
  if(diffMin<1) duree="À l'instant"; else if(diffMin<60) duree=`Il y a ${diffMin} min`; else if(diffHour<24) duree=`Il y a ${diffHour}h`; else if(diffDay===1) duree="Hier"; else if(diffDay<7) duree=`Il y a ${diffDay} jours`; else duree=`Il y a ${Math.floor(diffDay/7)} sem.`;
  const date = d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}); const heure = d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  return {duree, date, heure, full:`Publié le ${date} à ${heure}`};
}
function sortBy(order){ sortOrder=order; renderFeed(); }

async function fetchProducts(){
  try{
    const res = await fetch(`${SUPABASE_URL}/products?select=*,boutiques(name,city,whatsapp)&order=created_at.desc`, {headers});
    if(!res.ok) return [];
    return await res.json();
  }catch(e){ return []; }
}

function commanderProduit(productName, boutiqueName, price, whatsapp){
  const user = getUser();
  if(!user){ showError('authError','⛔ Tu dois te connecter en tant que client pour commander.'); openAuth('login'); return; }
  if(user.role!=='client'){ alert('⛔ Seul un compte client peut commander.'); return; }
  const nomClient = `${user.prenom||''} ${user.nom||''}`.trim() || user.phone;
  const villeClient = user.ville || 'Non renseignée';
  const phoneClient = user.phone;
  const message = `Salut c'est ${nomClient} j'utilise SHOP ONLINE et je voudrais commander le produit : ${productName} de la boutique ${boutiqueName} je réside a ${villeClient} mon numéro est le ${phoneClient}`;
  const waNumber = whatsapp? `${whatsapp}` : '';
  if(!waNumber){ alert('Numéro WhatsApp boutique non disponible'); return; }
  window.open(`https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`, '_blank');
}

async function renderAll(){
  const user=getUser();
  document.getElementById('addPostFrame').style.display = user?.role==='vendeur'? 'flex' : 'none';
  document.getElementById('logoutBtn').style.display = user? 'inline-block' : 'none';
  const headerBtns = document.querySelectorAll('.header-inner');
  if(headerBtns[0]) headerBtns[0].style.display = user? 'none' : 'inline-block';
  if(headerBtns[1]) headerBtns[1].style.display = user? 'none' : 'inline-block';
  document.getElementById('userBadge').style.display = user? 'inline-block' : 'none';
  if(user) document.getElementById('userBadge').textContent = `${user.phone} • ${user.role}`;

  if(user && user.role==='vendeur'){
    const boutiques = await fetch(`${SUPABASE_URL}/boutiques?user_id=eq.${user.id}`, {headers}).then(r=>r.ok?r.json():[]);
    if(boutiques && boutiques[0]) document.getElementById('accountInfo').innerHTML=`<b>${boutiques[0].name}</b><div style="font-size:12px">${boutiques[0].city} • ${boutiques[0].activite} • ${boutiques[0].phone}</div>`;
    document.getElementById('accountInfo').style.display='block';
  } else if(user) {
    document.getElementById('accountInfo').innerHTML=`<b>${user.prenom||''} ${user.nom||''}</b><div style="font-size:12px">${user.ville||''} • ${user.phone} • ${user.role}</div>`;
    document.getElementById('accountInfo').style.display='block';
  } else {
    document.getElementById('accountInfo').style.display='none';
  }

  allProducts = await fetchProducts();
  renderFeed();
}

function renderFeed(){
  const el=document.getElementById('feed');
  let products = [...allProducts];
  if(sortOrder==='oldest') products.reverse();
  if(!products.length){
    el.innerHTML=`<div class="empty"><h2 style="font-size:22px;font-weight:800">SHOP ONLINE</h2><p>Aucune publication pour le moment.</p></div>`;
    return;
  }
  el.innerHTML=products.map(p=>{
    const time = formatDateTime(p.created_at);
    const isNew = (new Date() - new Date(p.created_at)) < 3600000;
    return `<div class="post-card">
      <div class="post-header"><div class="avatar"><img src="https://ui-avatars.com/api/?name=${encodeURIComponent(p.boutiques?.name||'Shop')}&background=111&color=fff"/></div><div style="flex:1"><div class="post-shop">${p.boutiques?.name||''} ${isNew?'<span class="badge-new">NOUVEAU</span>':''}</div><div class="post-meta">📍 ${p.boutiques?.city||''} • ⏰ ${time.duree}<br>📅 ${time.full}</div></div></div>
      <div class="post-content"><div class="post-title">${p.name}</div>${p.description?`<div class="post-desc">${p.description}</div>`:''}<div class="price-tag">${Number(p.price).toLocaleString()} FCFA</div></div>
      <div style="padding:12px 16px 16px"><button class="btn-commander" onclick="commanderProduit('${p.name}', '${p.boutiques?.name||''}', ${p.price}, '${p.boutiques?.whatsapp||''}')">🛒 Commander</button></div>
    </div>`;
  }).join('');
}

function openPublish(){const u=getUser(); if(!u||u.role!=='vendeur') return; document.getElementById('publishModal').classList.add('open')}
function closePublish(){document.getElementById('publishModal').classList.remove('open')}

async function publishProduct(){
  const user=getUser(); const name=document.getElementById('pName').value.trim(),desc=document.getElementById('pDesc').value.trim(),price=document.getElementById('pPrice').value.trim();
  if(!name||!price){alert('Nom + prix obligatoires');return}
  const boutiques = await fetch(`${SUPABASE_URL}/boutiques?user_id=eq.${user.id}`, {headers}).then(r=>r.ok?r.json():[]);
  if(!boutiques[0]) return alert("Crée d'abord ta boutique");
  await fetch(`${SUPABASE_URL}/products`, {method:'POST', headers, body:JSON.stringify({
    boutique_id:boutiques[0].id, name, description:desc, price:parseInt(price), category:document.getElementById('pCat').value
  })});
  closePublish(); document.getElementById('pName').value='';document.getElementById('pDesc').value='';document.getElementById('pPrice').value=''; renderAll();
}

function openAuth(m='register'){mode=m;document.getElementById('authModal').classList.add('open');upd(); document.getElementById('authError').classList.remove('show');}
function closeAuth(){document.getElementById('authModal').classList.remove('open')}
function setRole(r){role=r;upd()}
function toggleMode(){mode=mode==='register'?'login':'register';upd()}
function upd(){document.getElementById('rc').style.background=role==='client'?'#111':'transparent';document.getElementById('rc').style.color=role==='client'?'#fff':'#111';document.getElementById('rv').style.background=role==='vendeur'?'#111':'transparent';document.getElementById('rv').style.color=role==='vendeur'?'#fff':'#111';const isLogin=mode==='login';document.getElementById('f-client').style.display=!isLogin&&role==='client'?'block':'none';document.getElementById('f-vendeur').style.display=!isLogin&&role==='vendeur'?'block':'none';document.getElementById('loginBox').style.display=isLogin?'block':'none';document.getElementById('authTitle').textContent=isLogin?'Connexion':'Créer compte';document.getElementById('roleSwitch').style.display=isLogin?'none':'grid';document.getElementById('switchLink').textContent=isLogin?'Créer compte':'Se connecter'}

async function register(e){
  e.preventDefault(); 
  const fd=new FormData(e.target); 
  const data = Object.fromEntries(fd.entries()); 
  data.role = role; 
  data.phone = '237' + data.phone;
  
  const res = await fetch(`${SUPABASE_URL}/users`, {method:'POST', headers, body:JSON.stringify(data)});
  
  if(!res.ok){ 
    const err = await res.json().catch(()=>({message:'Erreur 401: Désactive RLS dans Supabase'}));
    return showError('authError', `⛔ Erreur: ${err.message}`);
  }
  
  const userArr = await res.json();
  const user = userArr[0];

  if(role==='vendeur'){
    await fetch(`${SUPABASE_URL}/boutiques`, {method:'POST', headers, body:JSON.stringify({
      user_id:user.id, name:data.boutiqueName, phone:data.phone, email:data.email,
      whatsapp:'237' + data.whatsapp, city:data.city, activite:data.activite
    })});
  }
  setUser(user); closeAuth(); renderAll(); alert("Compte créé avec succès!");
}

async function doLogin(){
  const phone = '237' + document.getElementById('loginPhone').value;
  const pass = document.getElementById('loginPassword').value;
  const users = await fetch(`${SUPABASE_URL}/users?phone=eq.${phone}`, {headers}).then(r=>r.ok?r.json():[]);
  if(!users[0] || users[0].password!== pass) return showError('authError', '⛔ Téléphone ou mot de passe incorrect');
  setUser(users[0]); closeAuth(); renderAll();
}

function logout(){localStorage.removeItem('shoponline_user');renderAll();}
renderAll();
</script>
