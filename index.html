<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOP ONLINE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    body{font-family:Arial;background:#f5f5f5;margin:0;padding:20px}
    .card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 5px #0001;margin-bottom:20px}
    input,select,button{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:5px;box-sizing:border-box;font-size:15px}
    button{background:#25D366;color:#fff;border:none;cursor:pointer;font-weight:bold}
    button:hover{opacity:0.9}
    .hidden{display:none}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}
    .product{border:1px solid #eee;padding:10px;border-radius:8px;text-align:center;background:#fff}
    .product img{width:100%;height:150px;object-fit:cover;border-radius:5px}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;background:#fff;padding:15px;border-radius:10px}
    a{color:#25D366;text-decoration:none;cursor:pointer;font-weight:bold}
</style>
</head>
<body>

<header>
    <h2>SHOP ONLINE</h2>
    <div id="userInfo"></div>
</header>

<!-- SEUL FORMULAIRE VISIBLE -->
<div id="authBox" class="card" style="max-width:400px;margin:40px auto;">
    <h3 style="text-align:center;">Connexion</h3>
    <form id="loginForm" onsubmit="login(event)">
        <select id="loginRole">
            <option value="client">Je suis Client</option>
            <option value="vendeur">Je suis Vendeur / Boutique</option>
        </select>
        <input name="phone" placeholder="Numéro WhatsApp" required />
        <input name="password" type="password" placeholder="Mot de passe" required />
        <button type="submit">Se connecter</button>
    </form>
    <p style="text-align:center;margin-top:15px;font-size:14px;">
        Pas de compte ? <a onclick="showRegister()">S'inscrire ici</a>
    </p>
</div>

<!-- FORMULAIRE INSCRIPTION CACHE -->
<div id="registerBox" class="card hidden" style="max-width:400px;margin:40px auto;">
    <h3 style="text-align:center;">Inscription</h3>
    <form id="registerForm" onsubmit="register(event)">
        <select id="registerRole">
            <option value="client">Je suis Client</option>
            <option value="vendeur">Je suis Boutique / Vendeur</option>
        </select>
        <input name="nom" placeholder="Nom" required />
        <input name="prenom" placeholder="Prénom" required />
        <input name="phone" placeholder="Numéro WhatsApp" required />
        <input name="ville" placeholder="Ville" />
        <div id="vendeurFields" class="hidden">

    <input name="boutique" placeholder="Nom de la boutique">

    <input name="whatsapp" placeholder="Numéro WhatsApp de la boutique">

    <input name="adresse" placeholder="Adresse de la boutique">

    <textarea
        name="description"
        placeholder="Décrivez votre boutique"
        style="width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:5px;">
    </textarea>

    <input
        name="logo"
        placeholder="Lien du logo ou de la photo de la boutique">

</div>
        <input name="password" type="password" placeholder="Mot de passe" required />
        <button type="submit">Valider l'inscription</button>
    </form>
    <p style="text-align:center;margin-top:15px;font-size:14px;">
        Déjà inscrit ? <a onclick="showLogin()">Se connecter</a>
    </p>
</div>

<!-- APP -->
<div id="app" class="hidden">
    <div id="clientView" class="hidden"><h3>Produits</h3><div id="products" class="grid"></div></div>
    <div id="vendeurView" class="hidden">
      <div style="margin-bottom:15px;">
    <input
        type="text"
        id="searchProduct"
        placeholder="🔍 Rechercher un produit..."
        onkeyup="searchProducts()"
    >
</div>

<h3>Produits</h3>
        <h3>Ajouter un Produit</h3>
        <form class="card" onsubmit="addProduct(event)">

    <input name="nom" placeholder="Nom du produit" required />

    <select name="categorie" required>
        <option value="">Choisir une catégorie</option>
        <option value="Téléphones">📱 Téléphones</option>
        <option value="Ordinateurs">💻 Ordinateurs</option>
        <option value="Mode">👕 Mode</option>
        <option value="Maison">🏠 Maison</option>
        <option value="Beauté">💄 Beauté</option>
        <option value="Automobile">🚗 Automobile</option>
        <option value="Alimentation">🛒 Alimentation</option>
        <option value="Autres">📦 Autres</option>
    </select>

    <input name="prix" type="number" placeholder="Prix FCFA" required />

    <input name="image" placeholder="Lien de l'image" />

    <button type="submit">Publier</button>

</form>
        <h3>Mes Produits</h3><div id="myProducts" class="grid"></div>
    </div>
</div>

<script>
const supabase = window.supabase.createClient(
    "https://cvcgtiykdocjhwanyned.supabase.co",
    "sb_publishable_Q-_I_gqrhW-pCXDYtlofEg_g0gOM9Xd"
);
let role='client', allProducts=[], currentUser = null;

function setUser(u){ currentUser = u; localStorage.setItem('shoponline_user', JSON.stringify(u)); }
function logout(){ localStorage.removeItem('shoponline_user'); currentUser=null; renderAll(); }
function getUser() {

    const data = localStorage.getItem("shoponline_user");

    // Vérifie si aucune donnée n'est enregistrée
    if (!data || data === "undefined") {
        return null;
    }

    try {

        return JSON.parse(data);

    } catch (error) {

        console.error("Erreur LocalStorage :", error);

        // Supprime la donnée corrompue
        localStorage.removeItem("shoponline_user");

        return null;

    }

}

function showRegister(){document.getElementById('authBox').classList.add('hidden');document.getElementById('registerBox').classList.remove('hidden');}
function showLogin(){document.getElementById('registerBox').classList.add('hidden');document.getElementById('authBox').classList.remove('hidden');}

async function login(e){
    e.preventDefault(); const fd = new FormData(e.target); role = document.getElementById('loginRole').value;
    const { data, error } = await supabase.from('users').select().eq('phone', fd.get('phone')).eq('password', fd.get('password')).eq('role', role).single();
    if (error) {

    console.error(error);

    alert(error.message);

    return;

}

if (!data) {

    alert("Téléphone ou mot de passe incorrect.");

    return;

}
setUser(data);

    await renderAll();

}
async function register(e) {

    e.preventDefault();

    const fd = new FormData(e.target);

    role = document.getElementById("registerRole").value;

    // Vérifier si le numéro existe déjà
    const { data: existe } = await supabase
        .from("users")
        .select("id")
        .eq("phone", fd.get("phone"))
        .maybeSingle();

    if (existe) {
        alert("❌ Ce numéro est déjà utilisé.");
        return;
    }

    // Création du compte
    const { data, error } = await supabase
    .from("users")
    .insert([{
        nom: fd.get("nom"),
        prenom: fd.get("prenom"),
        phone: fd.get("phone"),
        ville: fd.get("ville"),
        password: fd.get("password"),
        role: role,

        boutique: role === "vendeur" ? fd.get("boutique") : null,
        whatsapp: role === "vendeur" ? fd.get("whatsapp") : null,
        adresse: role === "vendeur" ? fd.get("adresse") : null,
        description: role === "vendeur" ? fd.get("description") : null,
        logo: role === "vendeur" ? fd.get("logo") : null
    }])
    .select()
    .single();

    if (error) {
        console.error(error);
        alert("Erreur : " + error.message);
        return;
    }

    setUser(data);
    alert("✅ Compte créé avec succès !");

    await renderAll();
  }
async function loadProducts() {

    const { data, error } = await supabase
        .from("products")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Erreur produits :", error);
        alert(error.message);
        return;
    }

    allProducts = data || [];

    document.getElementById("products").innerHTML =
        allProducts.map(p => `
            <div class="product">
                <img src="${p.image || 'https://via.placeholder.com/150'}" alt="${p.nom}">
                <h4>${p.nom}</h4>
                <b>${p.prix} FCFA</b>
                <button onclick="buy(${p.id})">Acheter</button>
            </div>
        `).join("");

}
function searchProducts() {

    const recherche = document
        .getElementById("searchProduct")
        .value
        .toLowerCase();

    const produits = allProducts.filter(p =>
        p.nom.toLowerCase().includes(recherche)
    );

    document.getElementById("products").innerHTML =
        produits.map(p => `
            <div class="product">
                <img src="${p.image || 'https://via.placeholder.com/150'}" alt="${p.nom}">
                <h4>${p.nom}</h4>
                <b>${p.prix} FCFA</b>
                <button onclick="buy(${p.id})">Acheter</button>
            </div>
        `).join("");

}
async function addProduct(e) {

    e.preventDefault();

    const u = getUser();

    if (!u) {
        alert("⚠️ Connectez-vous d'abord.");
        return;
    }

    const fd = new FormData(e.target);

    const { data, error } = await supabase
.from("products")
.insert([{
    nom: fd.get("nom"),
    categorie: fd.get("categorie"),
    prix: Number(fd.get("prix")),
    image: fd.get("image") || null,
    vendeur_id: u.id
}])
        .select();

    if (error) {
        console.error(error);
        alert("❌ Erreur : " + error.message);
        return;
    }

    alert("✅ Produit publié avec succès !");

    e.target.reset();

    await loadProducts();
    await loadMyProducts();

}
async function loadMyProducts() {

    const u = getUser();

    const { data, error } = await supabase
        .from("products")
        .select("*")
        .eq("vendeur_id", u.id);

    if (error) {
        console.error("Erreur vendeur :", error);
        alert(error.message);
        return;
    }

    document.getElementById("myProducts").innerHTML =
        (data || []).map(p => `
            <div class="product">
                <h4>${p.nom}</h4>
                <b>${p.prix} FCFA</b>
            </div>
        `).join("");

}
function buy(id) {

    const p = allProducts.find(x => x.id == id);

    if (!p) {
        alert("Produit introuvable.");
        return;
    }

    const message =
        `Bonjour,j'utilise l'application SHOP ONLINE et sje souhaite acheter le produit "${p.nom}" au prix de ${p.prix} FCFA.`;

    window.open(
        "https://wa.me/?text=" + encodeURIComponent(message),
        "_blank"
    );

}
async function renderAll() {

    const u = getUser();

    // Aucun utilisateur connecté
    if (!u) {

        document.getElementById("app").classList.add("hidden");

        document.getElementById("authBox").classList.remove("hidden");

        document.getElementById("registerBox").classList.add("hidden");

        document.getElementById("userInfo").innerHTML = "";

        return;
    }

    // Utilisateur connecté
    document.getElementById("authBox").classList.add("hidden");
    document.getElementById("registerBox").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    document.getElementById("userInfo").innerHTML = `
        Salut ${u.prenom}
        <button onclick="logout()" style="width:auto;padding:8px 15px;margin-left:10px;">
            Déconnexion
        </button>
    `;

    if (u.role === "vendeur") {

        document.getElementById("vendeurView").classList.remove("hidden");
        document.getElementById("clientView").classList.add("hidden");

        await loadProducts();
        await loadMyProducts();

    } else {

        document.getElementById("clientView").classList.remove("hidden");
        document.getElementById("vendeurView").classList.add("hidden");

        await loadProducts();

    }
}
   const registerRole = document.getElementById("registerRole");
const vendeurFields = document.getElementById("vendeurFields");

if (registerRole && vendeurFields) {

    registerRole.addEventListener("change", function () {

        if (this.value === "vendeur") {
            vendeurFields.classList.remove("hidden");
        } else {
            vendeurFields.classList.add("hidden");
        }

    });

}
renderAll();
</script>
</body>
</html>
