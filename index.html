<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOP ONLINE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    body{font-family:Arial;background:#f5f5f5;margin:0;padding:20px}
    .card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 5px #0001;margin-bottom:20px}
    input,select,button{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:5px;box-sizing:border-box;font-size:15px}
    button{background:#25D366;color:#fff;border:none;cursor:pointer;font-weight:bold}
    button:hover{opacity:0.9}
    .hidden{display:none}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}
    .product{border:1px solid #eee;padding:10px;border-radius:8px;text-align:center;background:#fff}
    .product img{width:100%;height:150px;object-fit:cover;border-radius:5px}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;background:#fff;padding:15px;border-radius:10px}
    a{color:#25D366;text-decoration:none;cursor:pointer;font-weight:bold}
</style>
</head>
<body>

<header>
    <h2>SHOP ONLINE</h2>
    <div id="userInfo"></div>
</header>

<!-- SEUL FORMULAIRE VISIBLE -->
<div id="authBox" class="card" style="max-width:400px;margin:40px auto;">
    <h3 style="text-align:center;">Connexion</h3>
    <form id="loginForm" onsubmit="login(event)">
        <select id="loginRole">
            <option value="client">Je suis Client</option>
            <option value="vendeur">Je un vendeur/Boutique</option>
        </select>
        <input name="phone" placeholder="Numéro WhatsApp" required />
        <input name="password" type="password" placeholder="Mot de passe" required />
        <button type="submit">Se connecter</button>
    </form>
    <p style="text-align:center;margin-top:15px;font-size:14px;">
        Pas de compte ? <a onclick="showRegister()">S'inscrire ici</a>
    </p>
</div>

<!-- FORMULAIRE INSCRIPTION CACHE -->
<div id="registerBox" class="card hidden" style="max-width:400px;margin:40px auto;">
    <h3 style="text-align:center;">Inscription</h3>
    <form id="registerForm" onsubmit="register(event)">
        <select id="registerRole">
            <option value="client">Je suis Client</option>
            <option value="vendeur">Je suis Boutique / Vendeur</option>
        </select>
        <input name="nom" placeholder="Nom" required />
        <input name="prenom" placeholder="Prénom" required />
        <input name="phone" placeholder="Numéro WhatsApp" required />
        <input name="ville" placeholder="Ville" />
        <input name="password" type="password" placeholder="Mot de passe" required />
        <button type="submit">Valider l'inscription</button>
    </form>
    <p style="text-align:center;margin-top:15px;font-size:14px;">
        Déjà inscrit ? <a onclick="showLogin()">Se connecter</a>
    </p>
</div>

<!-- APP -->
<div id="app" class="hidden">
    <div id="clientView" class="hidden"><h3>Produits</h3><div id="products" class="grid"></div></div>
    <div id="vendeurView" class="hidden">
        <h3>Ajouter un Produit</h3>
        <form class="card" onsubmit="addProduct(event)">
            <input name="nom" placeholder="Nom du produit" required />
            <input name="prix" type="number" placeholder="Prix FCFA" required />
            <input name="image" placeholder="Lien Image" />
            <button>Publier</button>
        </form>
        <h3>Mes Produits</h3><div id="myProducts" class="grid"></div>
    </div>
</div>

<script>
const supabase = window.supabase.createClient(
    "https://cvcgtiykdocjhwanyned.supabase.co",
    "sb_publishable_Q-_I_gqrhW-pCXDYtlofEg_g0gOM9Xd"
);
let role='client', allProducts=[], currentUser = null;

function setUser(u){ currentUser = u; localStorage.setItem('shoponline_user', JSON.stringify(u)); }
function logout(){ localStorage.removeItem('shoponline_user'); currentUser=null; renderAll(); }
function getUser(){ const data = localStorage.getItem("shoponline_user"); if(!data) return null; try{currentUser=JSON.parse(data);return currentUser;}catch{return null;} }

function showRegister(){document.getElementById('authBox').classList.add('hidden');document.getElementById('registerBox').classList.remove('hidden');}
function showLogin(){document.getElementById('registerBox').classList.add('hidden');document.getElementById('authBox').classList.remove('hidden');}

async function login(e){
    e.preventDefault(); const fd = new FormData(e.target); role = document.getElementById('loginRole').value;
    const { data, error } = await supabase.from('users').select().eq('phone', fd.get('phone')).eq('password', fd.get('password')).eq('role', role).single();
    if(error || !data) return alert("Identifiants incorrects"); setUser(data); renderAll();
}

async function register(e){
    e.preventDefault(); const fd = new FormData(e.target); role = document.getElementById('registerRole').value;
    const { data, error } = await supabase.from('users').insert([{nom:fd.get('nom'),prenom:fd.get('prenom'),phone:fd.get('phone'),ville:fd.get('ville'),password:fd.get('password'),role:role}]).select().single();
    if(error){ if(error.code==='23505') alert("Numéro déjà utilisé"); else alert("Erreur"); return; } setUser(data); alert('Compte créé !'); renderAll();
}

async function loadProducts(){ const { data } = await supabase.from('products').select('*').order('created_at',{ascending:false}); allProducts = data || []; document.getElementById('products').innerHTML = allProducts.map(p=>`<div class="product"><img src="${p.image||'https://via.placeholder.com/150'}"/><h4>${p.nom}</h4><b>${p.prix} FCFA</b><button onclick="buy(${p.id})">Acheter</button></div>`).join(''); }
async function addProduct(e){ e.preventDefault(); const u=getUser(); const fd=new FormData(e.target); await supabase.from('products').insert({nom:fd.get('nom'),prix:fd.get('prix'),image:fd.get('image'),vendeur_id:u.id}); e.target.reset(); loadProducts(); loadMyProducts(); }
async function loadMyProducts(){ const u=getUser(); const { data } = await supabase.from('products').select('*').eq('vendeur_id',u.id); document.getElementById('myProducts').innerHTML = (data||[]).map(p=>`<div class="product"><h4>${p.nom}</h4><b>${p.prix} FCFA</b></div>`).join(''); }
function buy(id){ const p=allProducts.find(x=>x.id===id); window.open(`https://wa.me/?text=${encodeURIComponent('Bonjour, je veux '+p.nom+' à '+p.prix+' FCFA')}`,'_blank'); }

async function renderAll(){
    const u = getUser();
    if(!u){ document.getElementById('app').classList.add('hidden'); document.getElementById('authBox').classList.remove('hidden'); document.getElementById('userInfo').innerHTML = ''; return; }
    document.getElementById('authBox').classList.add('hidden'); document.getElementById('registerBox').classList.add('hidden'); document.getElementById('app').classList.remove('hidden');
    document.getElementById('userInfo').innerHTML = `Salut ${u.prenom} <button onclick="logout()" style="width:auto;padding:8px 15px;margin-left:10px;">Déconnexion</button>`;
    if(u.role==='vendeur'){ document.getElementById('vendeurView').classList.remove('hidden'); document.getElementById('clientView').classList.add('hidden'); loadMyProducts(); }
    else{ document.getElementById('clientView').classList.remove('hidden'); document.getElementById('vendeurView').classList.add('hidden'); loadProducts(); }
}
renderAll();
</script>
</body>
</html>
