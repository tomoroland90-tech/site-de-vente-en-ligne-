<style>
    body{font-family:Arial;background:#f5f5f5;margin:0;padding:20px}
    .card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 5px #0001;margin-bottom:20px}
    input,select,button{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:5px;box-sizing:border-box;font-size:15px}
    button{background:#25D366;color:#fff;border:none;cursor:pointer;font-weight:bold}
    button:hover{opacity:0.9}
    .hidden{display:none}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}
    .product{border:1px solid #eee;padding:10px;border-radius:8px;text-align:center;background:#fff}
    .product img{width:100%;height:150px;object-fit:cover;border-radius:5px}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;background:#fff;padding:15px;border-radius:10px}
    a{color:#25D366;text-decoration:none;cursor:pointer;font-weight:bold}

    .seller-info{margin-top:12px;padding:10px;border-top:1px solid #eee;text-align:left}
    .seller-name{font-weight:bold;font-size:15px;margin-bottom:4px}
    .seller-location{font-size:13px;color:#666;margin-bottom:8px}
    .seller-profile-btn{background:#2563eb!important;margin-top:8px}

    .seller-modal.hidden{display:none!important}
    .seller-modal-box{background:#fff;border-radius:14px;padding:24px;max-width:520px;width:100%;max-height:90vh;overflow:auto;position:relative}
    .close-profile{position:absolute;right:12px;top:8px;width:40px!important;height:40px!important;padding:0!important;background:#eee!important;color:#222!important;border-radius:50%!important;font-size:25px!important}
    .seller-logo{width:110px;height:110px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 12px}
    .seller-profile-title{text-align:center;margin:5px 0}

.roleButtons{display:flex;gap:10px;margin:15px 0}.roleButtons button{flex:1;padding:12px;border:none;border-radius:10px;background:#ddd;font-weight:bold}.roleButtons button.active{background:#2563eb;color:#fff}
.roleButtons{display:flex;gap:10px;margin:15px 0}
.roleButtons button{flex:1;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;font-weight:bold;cursor:pointer}
input,select,textarea{border-radius:12px;padding:14px}
.input-group{
    position:relative;
    margin:20px 0;
}

.input-group input,
.input-group textarea{

    width:100%;
    padding:18px 15px 8px;

    border:2px solid #ddd;

.input-group label{

    position:absolute;

    padding:0 5px;

    color:#777;

    transition:.3s;

    pointer-events:none;
}

.input-group input:focus,
.input-group textarea:focus{

    border-color:#2563eb;

}

.input-group input:focus+label,
.input-group input:not(:placeholder-shown)+label,

.input-group textarea:focus+label,
.input-group textarea:not(:placeholder-shown)+label{

    top:-10px;

    left:12px;

    color:#2563eb;

    font-size:12px;

    font-weight:bold;
}
.shop-info{

    background:#fff;

.shop-right{

}

.shop-right button:hover{

}

.profile-circle{

    width:140px;

    border-radius:50%;

    margin:auto;

}

.profile-circle:hover{

.profile-circle img{

}

.camera-icon{

    bottom:8px;

    align-items:center;

.nav-right{

    display:flex;

    align-items:center;

    gap:15px;

}

.seller-profile{

    width:45px;

    height:45px;

    border-radius:50%;

    overflow:hidden;

    border:3px solid #16a34a;

}

.seller-profile:hover{

.seller-profile img{

.nav-btn{

    background:#2563eb;

.nav-btn:hover{

.seller-profile-page{

    overflow:hidden;

    margin:25px 0;

}

.cover-container{

}

.cover-container img{

    width:100%;

    height:280px;

    object-fit:cover;

}

.profile-header{

    display:flex;

    gap:25px;

    padding:25px;

    align-items:flex-start;

}

.profile-photo-container{

    position:relative;

}

.profile-photo-container img{

    width:170px;

    height:170px;

    border-radius:50%;

    object-fit:cover;

    border:6px solid white;

    margin-top:-90px;

}

.seller-infos{

    flex:1;

}

.seller-infos h2{

    color:#0f766e;

    font-size:34px;

}

.verified-badge{

    display:inline-block;

    background:#16a34a;

    color:white;

    padding:6px 14px;

    border-radius:30px;

    margin:12px 0;

}

.profile-actions{

    display:flex;

    align-items:center;

.edit-cover-btn,

    background:#2563eb;

    color:white;

    border:none;

    cursor:pointer;

    border-radius:10px;

    padding:10px 15px;

}

.photo-edit-btn{

    position:absolute;

    bottom:15px;

    right:0;

    border-radius:50%;

}
</style>

<script>
const supabaseClient = window.supabase.createClient(
    "https://cvcgtiykdocjhwanyned.supabase.co",
    "sb_publishable_Q-_I_gqrhW-pCXDYtlofEg_g0gOM9Xd"
);

let role = "client";
let allProducts = [];
let currentUser = null;

function setUser(user) {
    currentUser = user;
    localStorage.setItem("shoponline_user", JSON.stringify(user));
}

function getUser() {
    const data = localStorage.getItem("shoponline_user");
    if (!data || data === "undefined" || data === "null") return null;

    try {
        return JSON.parse(data);
    } catch (error) {
        console.error("Erreur LocalStorage :", error);
        localStorage.removeItem("shoponline_user");
        return null;
    }
}

async function logout() {
    localStorage.removeItem("shoponline_user");
    currentUser = null;
    await renderAll();
}

function showRegister() {
    document.getElementById("authBox").classList.add("hidden");
    document.getElementById("registerBox").classList.remove("hidden");
}

function showLogin() {
    document.getElementById("registerBox").classList.add("hidden");
    document.getElementById("authBox").classList.remove("hidden");
}

async function login(event) {
    event.preventDefault();

    const fd = new FormData(event.target);
    role = loginRole;

    const { data, error } = await supabaseClient
        .from("users")
        .select("*")
        .eq("phone", fd.get("phone"))
        .eq("password", fd.get("password"))
        .eq("role", role)
        .maybeSingle();

    if (error) {
        console.error(error);
        alert("Erreur : " + error.message);
        return;
    }

    if (!data) {
        alert("❌ Téléphone, mot de passe ou rôle incorrect.");
        return;
    }

    setUser(data);

    // Afficher la photo du vendeur dans la barre de navigation
    await loadNavbarProfile();

    alert("✅ Connexion réussie !");

    await renderAll();
}

async function register(event) {
    event.preventDefault();

    const fd = new FormData(event.target);
    role = registerRole;
const logoFile = document.getElementById("profilePhoto").files[0];

let logoUrl = null;
    const { data: existe, error: checkError } = await supabaseClient
        .from("users")
        .select("id")
        .eq("phone", fd.get("phone"))
        .maybeSingle();

    if (checkError) {
        alert("Erreur : " + checkError.message);
        return;
    }

    if (existe) {
        alert("❌ Ce numéro est déjà utilisé.");
        return;
    }
if (role === "vendeur" && logoFile) {

    const fileName =
        Date.now() + "-" + logoFile.name;

    const { error: uploadError } =
        await supabaseClient.storage
        .from("products")   // ton bucket
        .upload(fileName, logoFile);

    if (uploadError) {

        alert(uploadError.message);

        return;

    }

    const { data } =
        supabaseClient.storage
        .from("products")
        .getPublicUrl(fileName);

    logoUrl = data.publicUrl;

}
    const userData = {
        nom: fd.get("nom"),
        prenom: fd.get("prenom"),
        phone: fd.get("phone"),
        ville: fd.get("ville") || null,
        password: fd.get("password"),
        role: role,
        boutique: role === "vendeur" ? (fd.get("boutique") || null) : null,
        whatsapp: role === "vendeur" ? (fd.get("whatsapp") || null) : null,
        adresse: role === "vendeur" ? (fd.get("adresse") || null) : null,
        description: role === "vendeur" ? (fd.get("description") || null) : null,
        logo: logoUrl
    };

    const { data, error } = await supabaseClient
        .from("users")
        .insert([userData])
        .select("*")
        .single();

    if (error) {
        console.error(error);
        alert("Erreur : " + error.message);
        return;
    }

    setUser(data);
    alert("✅ Compte créé avec succès !");
    event.target.reset();

    document.getElementById("vendeurFields").classList.add("hidden");

    await renderAll();
}

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function productHTML(p) {
    const image = p.image || "https://via.placeholder.com/300x200?text=Produit";
    const seller = p.seller || {};

    return `
        <div class="product">
            <img src="${escapeHTML(image)}" alt="${escapeHTML(p.nom || "Produit")}">
            <h4>${escapeHTML(p.nom || "Produit")}</h4>
            <p>${escapeHTML(p.categorie || "Autres")}</p>
            <b>${Number(p.prix || 0).toLocaleString("fr-FR")} FCFA</b>

            <div class="seller-info">
                <div class="seller-name">
                    🏪 ${escapeHTML(seller.boutique || seller.prenom || seller.nom || "Vendeur")}
                </div>
                <div class="seller-location">
                    📍 ${escapeHTML(seller.ville || "Ville non renseignée")}
                </div>
                <button type="button"
                        class="seller-profile-btn"
                        onclick="viewSellerProfile(${Number(p.vendeur_id)})">
                    👤 Voir le profil du vendeur
                </button>
            </div>

            <button type="button" onclick="buy(${Number(p.id)})">
                Acheter
            </button>
        </div>
    `;
}

async function loadProducts() {
    const { data, error } = await supabaseClient
        .from("products")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Erreur produits :", error);
        alert("Erreur produits : " + error.message);
        return;
    }

    allProducts = data || [];

    const sellerIds = [...new Set(
        allProducts
            .map(p => p.vendeur_id)
            .filter(Boolean)
    )];

    if (sellerIds.length) {
        const { data: sellers, error: sellerError } = await supabaseClient
            .from("users")
            .select("id,nom,prenom,ville,boutique,whatsapp,adresse,description,logo")
            .in("id", sellerIds);

        if (sellerError) {
            console.error("Erreur vendeurs :", sellerError);
        } else {
            const sellerMap = new Map((sellers || []).map(s => [s.id, s]));
            allProducts = allProducts.map(p => ({
                ...p,
                seller: sellerMap.get(p.vendeur_id) || {}
            }));
        }
    }

    displayProducts(allProducts);
}

function displayProducts(products) {
    const container = document.getElementById("products");
    if (!container) return;

    if (!products.length) {
        container.innerHTML = "<p>Aucun produit trouvé.</p>";
        return;
    }

    container.innerHTML = products.map(productHTML).join("");
}

function searchProducts() {
    const input = document.getElementById("searchProduct");
    if (!input) return;

    const search = input.value.trim().toLowerCase();

    const filtered = allProducts.filter(p => {
        const nom = String(p.nom || "").toLowerCase();
        const categorie = String(p.categorie || "").toLowerCase();
        return nom.includes(search) || categorie.includes(search);
    });

    displayProducts(filtered);
}

async function addProduct(event) {
    event.preventDefault();

    const user = getUser();

    if (!user || user.role !== "vendeur") {
        alert("⚠️ Connectez-vous avec un compte vendeur.");
        return;
    }

    const fd = new FormData(event.target);
    const prix = Number(fd.get("prix"));

    if (!Number.isFinite(prix) || prix < 0) {
        alert("❌ Prix invalide.");
        return;
    }

    const { error } = await supabaseClient
        .from("products")
        .insert([{
            nom: fd.get("nom"),
            categorie: fd.get("categorie"),
            prix: prix,
            image: fd.get("image") || null,
            vendeur_id: user.id
        }]);

    if (error) {
        console.error(error);
        alert("❌ Erreur : " + error.message);
        return;
    }

    alert("✅ Produit publié avec succès !");
    event.target.reset();

    await loadProducts();
    await loadMyProducts();
}

async function loadMyProducts() {
    const user = getUser();
    if (!user) return;

    const { data, error } = await supabaseClient
        .from("products")
        .select("*")
        .eq("vendeur_id", user.id)
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Erreur vendeur :", error);
        alert("Erreur vendeur : " + error.message);
        return;
    }

    const container = document.getElementById("myProducts");
    if (!container) return;

    container.innerHTML = (data || []).map(p => `
        <div class="product">
            <img src="${escapeHTML(p.image || "https://via.placeholder.com/150")}"
                 alt="${escapeHTML(p.nom || "Produit")}">
            <h4>${escapeHTML(p.nom || "Produit")}</h4>
            <b>${Number(p.prix || 0).toLocaleString("fr-FR")} FCFA</b>
        </div>
    `).join("") || "<p>Vous n'avez encore publié aucun produit.</p>";
}

function buy(id) {
    const product = allProducts.find(p => Number(p.id) === Number(id));

    if (!product) {
        alert("❌ Produit introuvable.");
        return;
    }

    const message =
        `Bonjour, j'utilise l'application SHOP ONLINE et je souhaite acheter le produit "${product.nom}" au prix de ${product.prix} FCFA.`;

    window.open(
        "https://wa.me/?text=" + encodeURIComponent(message),
        "_blank"
    );
}


async function viewSellerProfile(vendeurId) {
    if (!vendeurId) {
        alert("Profil du vendeur indisponible.");
        return;
    }

    const { data: seller, error } = await supabaseClient
        .from("users")
        .select("id,nom,prenom,ville,boutique,whatsapp,adresse,description,logo")
        .eq("id", vendeurId)
        .maybeSingle();

    if (error) {
        console.error("Erreur profil vendeur :", error);
        alert("Impossible de charger le profil du vendeur.");
        return;
    }

    if (!seller) {
        alert("Vendeur introuvable.");
        return;
    }

    const content = document.getElementById("sellerProfileContent");

    const logo = seller.logo ||
        "https://via.placeholder.com/150?text=Boutique";

    const phone = seller.whatsapp || "";

    content.innerHTML = `
        <img class="seller-logo"
             src="${escapeHTML(logo)}"
             alt="Logo de la boutique">

        <h2 class="seller-profile-title">
            🏪 ${escapeHTML(seller.boutique || "Boutique")}
        </h2>

        <p style="text-align:center;color:#666;">
            ${escapeHTML((seller.prenom || "") + " " + (seller.nom || ""))}
        </p>

        <div class="seller-profile-data">
            <p>📍 <strong>Ville :</strong> ${escapeHTML(seller.ville || "Non renseignée")}</p>
            <p>🏠 <strong>Adresse :</strong> ${escapeHTML(seller.adresse || "Non renseignée")}</p>
            <p>📝 <strong>Description :</strong><br>
                ${escapeHTML(seller.description || "Aucune description.")}
            </p>
        </div>

        ${phone ? `
            <button type="button"
                    onclick="contactSeller('${escapeHTML(phone)}')">
                💬 Contacter le vendeur sur WhatsApp
            </button>
        ` : ""}
    `;

    document.getElementById("sellerProfileModal").classList.remove("hidden");
}

function closeSellerProfile() {
    document.getElementById("sellerProfileModal").classList.add("hidden");
}

function contactSeller(phone) {
    const cleanPhone = String(phone).replace(/[^\d]/g, "");

    if (!cleanPhone) {
        alert("Numéro WhatsApp invalide.");
        return;
    }

    const message = "Bonjour, je viens de voir votre boutique sur SHOP ONLINE.";
    window.open(
        "https://wa.me/" + cleanPhone + "?text=" + encodeURIComponent(message),
        "_blank"
    );
}


async function renderAll() {
    loadNavbarProfile();
    const user = getUser();

    const app = document.getElementById("app");
    const authBox = document.getElementById("authBox");
    const registerBox = document.getElementById("registerBox");
    const clientView = document.getElementById("clientView");
    const vendeurView = document.getElementById("vendeurView");
    const userInfo = document.getElementById("userInfo");

    if (!user) {
        app.classList.add("hidden");
        authBox.classList.remove("hidden");
        registerBox.classList.add("hidden");
        clientView.classList.add("hidden");
        vendeurView.classList.add("hidden");
        userInfo.innerHTML = "";
        return;
    }

    currentUser = user;

    authBox.classList.add("hidden");
    registerBox.classList.add("hidden");
    app.classList.remove("hidden");

    userInfo.innerHTML = `
        Salut ${escapeHTML(user.prenom || "")}
        <button type="button"
                onclick="logout()"
                style="width:auto;padding:8px 15px;margin-left:10px;">
            Déconnexion
        </button>
    `;

    if (user.role === "vendeur") {
        document
.getElementById("sellerProfilePage")
.classList.remove("hidden");

loadSellerProfile();
        vendeurView.classList.remove("hidden");
        clientView.classList.add("hidden");
        await loadProducts();
        await loadMyProducts();
    } else {
        clientView.classList.remove("hidden");
        vendeurView.classList.add("hidden");
        await loadProducts();
    }
}

let loginRole = "client";
let registerRole = "client";

function selectLoginRole(role) {
    loginRole = role;

    document.getElementById("btnClientLogin")?.classList.toggle("active", role === "client");
    document.getElementById("btnSellerLogin")?.classList.toggle("active", role === "vendeur");
}

function selectRegisterRole(role) {
    registerRole = role;

    document.getElementById("btnClientRegister")?.classList.toggle("active", role === "client");
    document.getElementById("btnSellerRegister")?.classList.toggle("active", role === "vendeur");

    const vendeurFields = document.getElementById("vendeurFields");
    if (vendeurFields) {
        vendeurFields.classList.toggle("hidden", role !== "vendeur");
    }
}
function loadShopProfile(){

    const u = getUser();

    if(!u) return;

    document.getElementById("shopName").textContent =
        u.boutique || "Ma Boutique";

    document.getElementById("shopAddress").textContent =
        u.adresse || "Non renseignée";

    document.getElementById("shopWhatsapp").textContent =
        u.whatsapp || "Non renseigné";

    document.getElementById("shopDate").textContent =
        new Date().getFullYear();

}
document
.getElementById("profilePhoto")
.addEventListener("change",function(){

    const file=this.files[0];

    if(!file) return;

    const reader=new FileReader();

    reader.onload=function(e){

        document.getElementById("profilePreview").src=e.target.result;

    };

    reader.readAsDataURL(file);

});
function loadNavbarProfile() {

    const user = getUser();

    if (!user) return;

    const photo = document.getElementById("navProfilePhoto");

    if (!photo) return;

    if (user.logo && user.logo.trim() !== "") {

        photo.src = user.logo;

    } else {

        photo.src = "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";

    }

}
function loadSellerProfile() {

    const user = getUser();

    if (!user) return;

    document.getElementById("sellerShopName").textContent = user.boutique || "";

    document.getElementById("sellerPhone").textContent = user.phone || "";

    document.getElementById("sellerCity").textContent = user.ville || "";

    document.getElementById("sellerWhatsapp").textContent = user.whatsapp || "";

    document.getElementById("sellerDescription").textContent = user.description || "";

    if (user.logo) {
        document.getElementById("sellerPhoto").src = user.logo;
    }

}
renderAll();
